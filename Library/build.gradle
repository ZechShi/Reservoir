plugins {
    id 'com.android.library'
}

android {
    namespace 'com.anupcowkur.reservoir'
    compileSdk 35

    defaultConfig {
        minSdk 21
        versionName project.VERSION_NAME
        versionCode Integer.parseInt(project.VERSION_CODE)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.jakewharton:disklrucache:2.0.2'
    implementation 'com.google.code.gson:gson:2.11.0'
    compileOnly 'io.reactivex.rxjava3:rxandroid:3.0.2'
    compileOnly 'io.reactivex.rxjava3:rxjava:3.1.8'
}

tasks.register('makeJavadocs', Javadoc) {
    source = android.sourceSets.main.java.srcDirs
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
}

afterEvaluate {
    tasks.named('makeJavadocs').configure {
        classpath += project.android.libraryVariants.toList().first().javaCompileProvider.get().classpath
    }
}

tasks.register('makeJavadocsJar', Jar) {
    dependsOn 'makeJavadocs'
    archiveClassifier.set('javadoc')
    from tasks.named('makeJavadocs').get().destinationDir
}

