plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.anupcowkur.reservoir'
    compileSdk 35

    defaultConfig {
        minSdk 21
        versionName project.VERSION_NAME
        versionCode Integer.parseInt(project.VERSION_CODE)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation 'com.jakewharton:disklrucache:2.0.2'
    implementation 'com.google.code.gson:gson:2.11.0'
    compileOnly 'io.reactivex.rxjava3:rxandroid:3.0.2'
    compileOnly 'io.reactivex.rxjava3:rxjava:3.1.8'
}

tasks.register('makeJavadocs', Javadoc) {
    source = android.sourceSets.main.java.srcDirs
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))
}

afterEvaluate {
    tasks.named('makeJavadocs').configure {
        classpath += project.android.libraryVariants.toList().first().javaCompileProvider.get().classpath
    }
}

tasks.register('makeJavadocsJar', Jar) {
    dependsOn 'makeJavadocs'
    archiveClassifier.set('javadoc')
    from tasks.named('makeJavadocs').get().destinationDir
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.anupcowkur'
                artifactId = 'reservoir'
                version = project.VERSION_NAME

                pom {
                    name = 'Reservoir'
                    description = 'Android library to easily serialize and cache your objects to disk using key/value pairs'
                    url = 'https://github.com/anupcowkur/Reservoir'

                    licenses {
                        license {
                            name = 'The MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }

                    developers {
                        developer {
                            id = 'anupcowkur'
                            name = 'Anup Cowkur'
                        }
                    }

                    scm {
                        connection = 'scm:git:github.com/anupcowkur/Reservoir.git'
                        developerConnection = 'scm:git:ssh://github.com/anupcowkur/Reservoir.git'
                        url = 'https://github.com/anupcowkur/Reservoir/tree/master'
                    }
                }
            }
        }
    }
}

